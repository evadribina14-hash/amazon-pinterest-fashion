<!doctype html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#b9787c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Amazon → Pinterest Fashion AI</title>
  
  <style>
:root{--rose:#b9787c;--rose2:#d9a6a5;--cream:#fbf5f0;--card:#fffaf7;--ink:#2f2928;--muted:#766d6b;--line:#eadbd5;--green:#4f9b83}
*{box-sizing:border-box} body{margin:0;background:#efe4de;font-family:Arial,sans-serif;color:var(--ink)}
button,input,select,textarea{font:inherit}.app{}
#app{max-width:520px;margin:auto;min-height:100vh;background:var(--cream);box-shadow:0 0 30px #0001;padding-bottom:82px}
.topbar{position:sticky;top:0;z-index:5;background:#fffaf8dd;backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:space-between;padding:18px 18px 12px;border-bottom:1px solid var(--line)}
.brand{font-family:Georgia,serif;font-size:20px}.brand-sub{font-family:Georgia,serif;font-size:16px;color:var(--rose)}
.icon-btn{border:0;background:#f2dfda;width:42px;height:42px;border-radius:50%;font-size:20px}
main{padding:18px}.hero{background:linear-gradient(135deg,#f1ded9,#fff9f5);padding:20px;border-radius:22px;margin-bottom:16px}
h1{font-family:Georgia,serif;font-size:28px;margin:0 0 7px}h2{font-family:Georgia,serif;font-size:21px;margin:4px 0 14px}
p{color:var(--muted);line-height:1.45}.search{display:flex;gap:8px}.search input{flex:1;min-width:0;border:1px solid var(--line);border-radius:13px;padding:13px;background:#fff}
.primary,.secondary{border:0;border-radius:13px;padding:13px 15px;font-weight:700}.primary{background:var(--rose);color:white}.secondary{background:#f1dfdb;color:#7d4f52}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0}.filters select,.filters input{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px;background:white}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.chip{border:1px solid var(--line);background:white;border-radius:20px;padding:8px 11px;color:#695d59}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.product{background:white;border:1px solid var(--line);border-radius:16px;overflow:hidden}.product img{width:100%;aspect-ratio:1/1.22;object-fit:cover;background:#eee}.product-body{padding:10px}.product-title{font-size:13px;font-weight:700;min-height:34px}.price{font-weight:800;margin:5px 0}.stars{font-size:12px;color:#d98b18}.product .primary{width:100%;padding:9px;margin-top:7px}
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pin{background:white;border:1px solid var(--line);border-radius:13px;overflow:hidden}.pin img{width:100%;aspect-ratio:2/3;object-fit:cover}.pin-body{padding:8px}.tag{font-size:10px;font-weight:800;color:#8b5559;background:#f4ddda;border-radius:10px;padding:5px 7px;display:inline-block}.pin button{width:100%;margin-top:7px}
.card{background:white;border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:13px}.field{margin:10px 0}.field label{font-size:12px;font-weight:700;display:block;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px;background:#fff}.field textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:9px;align-items:center}.row>*{flex:1}.muted{color:var(--muted);font-size:13px}.empty{padding:30px;text-align:center;color:var(--muted)}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{padding:9px 2px;text-align:center;border-radius:10px;background:#fff;border:1px solid var(--line);font-size:12px}.day.active{background:var(--rose);color:white}.agenda-item{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.thumb{width:48px;height:62px;border-radius:8px;object-fit:cover}
.stat{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}.progress{height:9px;background:#eadbd5;border-radius:8px;overflow:hidden}.progress>div{height:100%;background:var(--green);width:100%}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:520px;width:100%;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--line);z-index:10;padding:7px 4px calc(7px + env(safe-area-inset-bottom))}
.bottom-nav button{border:0;background:transparent;color:#6d6260;font-size:19px}.bottom-nav span{display:block;font-size:10px;margin-top:3px}.bottom-nav button.active{color:var(--rose);font-weight:800}
.back{border:0;background:transparent;padding:0 0 12px;font-size:14px;color:var(--rose)}
.toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);background:#2f2928;color:white;padding:11px 15px;border-radius:12px;z-index:30;font-size:13px}
@media(min-width:700px){#app{border-radius:22px;margin-top:20px;min-height:calc(100vh - 40px)}}

.image-strip{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.img-choice{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}.img-choice img{width:100%;aspect-ratio:1;object-fit:cover}.img-choice small{display:block;padding:6px;color:var(--muted)}

.image-picker{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.image-option{border:2px solid var(--line);background:white;border-radius:10px;padding:3px;overflow:hidden;color:var(--ink);cursor:pointer}
.image-option img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:7px;display:block}
.image-option span{display:block;font-size:9px;padding:4px 2px;line-height:1.2}
.image-option.selected{border-color:var(--rose);background:#f9e9e6}
.image-option.used{opacity:.42;cursor:not-allowed}
@media(max-width:380px){.image-picker{grid-template-columns:repeat(3,1fr)}}

/* Compact mobile typography */
h1{font-size:23px}
h2{font-size:18px}
.brand{font-size:17px}.brand-sub{font-size:14px}
p{font-size:13px}.product-title{font-size:12px}.price{font-size:14px}.muted{font-size:11px}
.card{font-size:13px}.card h2{font-size:17px}.field label{font-size:11px}.field input,.field textarea,.field select{font-size:12px;padding:9px}
.primary,.secondary{font-size:12px;padding:10px 12px}.chip{font-size:11px;padding:7px 9px}.bottom-nav button{font-size:17px}.bottom-nav span{font-size:9px}.stat{font-size:12px}.agenda-item{font-size:12px}.image-option span{font-size:8px}.pin-body{font-size:11px}.tag{font-size:9px}
</style>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div>
        <div class="brand">Amazon → Pinterest</div>
        <div class="brand-sub">Fashion AI</div>
      </div>
      <button class="icon-btn" onclick="showPage('settings')" aria-label="Iestatījumi">⚙</button>
    </header>

    <main id="content"></main>

    <nav class="bottom-nav">
      <button data-page="home" onclick="showPage('home')">⌂<span>Sākums</span></button>
      <button data-page="products" onclick="showPage('products')">⌕<span>Produkti</span></button>
      <button data-page="pins" onclick="showPage('pins')">✦<span>Pini</span></button>
      <button data-page="schedule" onclick="showPage('schedule')">▣<span>Grafiks</span></button>
      <button data-page="settings" onclick="showPage('settings')">☰<span>Vairāk</span></button>
    </nav>
  </div>
<script>
const products=[
 {id:1,title:"PRETTYGARDEN Women's Striped Sweater",price:"$36.99",images:[
 "https://images.unsplash.com/photo-1576566588028-4147f3842f27?auto=format&fit=crop&w=700&q=80",
 "https://images.unsplash.com/photo-1434389677669-e08b4cac3105?auto=format&fit=crop&w=700&q=80",
 "https://images.unsplash.com/photo-1551488831-00ddcb6c6bd3?auto=format&fit=crop&w=700&q=80",
 "https://images.unsplash.com/photo-1541099649105-f69ad21f3246?auto=format&fit=crop&w=700&q=80"
 ]},
 {id:2,title:"ANRABESS Women's Casual Blazer",price:"$49.99",images:[
 "https://images.unsplash.com/photo-1591369822096-ffd140ec948f?auto=format&fit=crop&w=700&q=80",
 "https://images.unsplash.com/photo-1551488831-00ddcb6c6bd3?auto=format&fit=crop&w=700&q=80",
 "https://images.unsplash.com/photo-1539109136881-3be0616acf4b?auto=format&fit=crop&w=700&q=80",
 "https://images.unsplash.com/photo-1485968579580-b6d095142e6e?auto=format&fit=crop&w=700&q=80"
 ]},
 {id:3,title:"MEROKEETY Women's Ribbed Sweater",price:"$32.99",images:[
 "https://images.unsplash.com/photo-1434389677669-e08b4cac3105?auto=format&fit=crop&w=700&q=80",
 "https://images.unsplash.com/photo-1485968579580-b6d095142e6e?auto=format&fit=crop&w=700&q=80",
 "https://images.unsplash.com/photo-1551488831-00ddcb6c6bd3?auto=format&fit=crop&w=700&q=80",
 "https://images.unsplash.com/photo-1525507119028-ed4c629a60a3?auto=format&fit=crop&w=700&q=80"
 ]},
 {id:5,title:"ZESICA Women's Sweater Dress",price:"$44.99",images:[
 "https://images.unsplash.com/photo-1496747611176-843222e1e57c?auto=format&fit=crop&w=700&q=80",
 "https://images.unsplash.com/photo-1485230895905-ec40ba36b9bc?auto=format&fit=crop&w=700&q=80",
 "https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?auto=format&fit=crop&w=700&q=80",
 "https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=700&q=80"
 ]},
 {id:6,title:"ANRABESS Women's Casual Blouse",price:"$29.99",images:[
 "https://images.unsplash.com/photo-1551488831-00ddcb6c6bd3?auto=format&fit=crop&w=700&q=80",
 "https://images.unsplash.com/photo-1564257577054-8b8f7b0f0e9f?auto=format&fit=crop&w=700&q=80",
 "https://images.unsplash.com/photo-1581044777550-4cfa60707c03?auto=format&fit=crop&w=700&q=80",
 "https://images.unsplash.com/photo-1534030347209-467a5b0f0c3d?auto=format&fit=crop&w=700&q=80"
 ]}
];

const boards=["Classy Minimal Outfits","Chic Everyday Outfit Ideas","Capsule wardrobe outfit ideas","Women's Outfit Ideas"];
const times=["10:00","14:00","18:30","21:00"];
let state={
 page:"home", selected:null, activeProduct:null,
 pins:JSON.parse(localStorage.getItem("pins")||"[]"),
 schedule:JSON.parse(localStorage.getItem("schedule")||"[]")
};

function save(){localStorage.setItem("pins",JSON.stringify(state.pins));localStorage.setItem("schedule",JSON.stringify(state.schedule))}
function nav(){document.querySelectorAll(".bottom-nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===state.page))}
function showPage(p){state.page=p;render();window.scrollTo(0,0)}
function toast(t){let x=document.createElement("div");x.className="toast";x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),2200)}
function imgCard(p,i){return `<div class="img-choice"><img src="${p.images[i]}" alt="Amazon image ${i+1}"><small>Amazon attēls ${i+1}</small></div>`}
function productCard(p){
 return `<article class="product">
   <img src="${p.images[0]}" alt="${p.title}">
   <div class="product-body">
     <div class="product-title">${p.title}</div>
     <div class="price">${p.price}</div>
     <div class="stars">★★★★★ <span class="muted">(2.8K)</span></div>
     <div class="muted" style="margin-top:5px">${p.images.length} Amazon bildes</div>
     <button class="primary" onclick="openProduct(${p.id})">Apskatīt un izveidot Pinus</button>
 </div></article>`
}
function home(){
 return `<div class="hero"><h1>Tava Pinterest Fashion AI</h1>
 <p>Atrodi Amazon apģērbu, apskati visas pieejamās produkta bildes un izveido 3 pilnīgi atšķirīgus Pin.</p>
 <button class="primary" onclick="showPage('products')">Meklēt produktus</button></div>
 <div class="card"><h2>Šodienas plāns</h2>
 <div class="stat"><span>Gatavie Pini</span><b>${state.pins.length}/3</b></div>
 <div class="progress"><div style="width:${Math.min(100,state.pins.length/3*100)}%"></div></div>
 <div class="stat"><span>LINK Pini</span><b>${state.pins.filter(x=>x.type==="LINK").length}/1</b></div></div>
 <div class="card"><h2>Pin informācija</h2>
 <p>Katram Pin tiek sagatavots angļu valodā: virsraksts, apraksts, dēlis, publicēšanas laiks, Tag Topics, Alt Text, affiliate link un AI modification statuss.</p></div>`
}
function productsPage(){
 return `<button class="back" onclick="showPage('home')">‹ Atpakaļ</button><h2>Amazon produkti</h2>
 <div class="search"><input id="q" placeholder="women's fall outfits"><button class="primary" onclick="doSearch()">Meklēt</button></div>
 <div class="filters"><select id="category"><option>All Women's Fashion</option><option>Dresses</option><option>Tops</option><option>Blouses</option><option>Shirts</option><option>Sweaters</option><option>Cardigans</option><option>Jackets</option><option>Blazers</option><option>Puffer Jackets</option><option>Coats</option><option>Trench Coats</option><option>Jumpsuits</option><option>Romper</option><option>Two-Piece Sets</option><option>Loungewear</option></select>
 <select><option>Best Match</option><option>Price: Low to High</option><option>Newest</option></select></div>
 <div class="chips">${["dresses","tops","blouses","shirts","sweaters","cardigans","jackets","blazers","puffer jackets","coats","trench coats","jumpsuits","rompers","two piece sets","loungewear"].map(x=>`<button class="chip" onclick="document.getElementById('q').value='women ${x}'">${x}</button>`).join("")}</div>
 <h2 style="margin-top:22px">Produkti</h2><div class="grid">${products.map(productCard).join("")}</div>`
}
function doSearch(){toast("Demo režīmā tiek parādīti piemēra produkti. Īstajā versijā šeit tiks meklēts Amazon.");}
function openProduct(id){state.activeProduct=products.find(x=>x.id===id);state.page="product";render()}
function productPage(){
 const p=state.activeProduct;
 return `<button class="back" onclick="showPage('products')">‹ Atpakaļ</button>
 <div class="card"><h2>${p.title}</h2><div class="price">${p.price}</div>
 <p>Amazon produkta bildes: ${p.images.length}. Izvēlies atšķirīgas bildes dažādiem Pin.</p><p class="muted">Aplikācija fokusējas uz kleitām, topiem, blūzēm, krekliem, džemperiem, kardiganiem, jakām, bleizeriem, pufaikām, mēteļiem, trenčiem, kombinezoniem, romperiem, komplektiem un loungewear.</p>
 <div class="image-strip">${p.images.map((_,i)=>imgCard(p,i)).join("")}</div>
 <button class="primary" style="width:100%;margin-top:14px" onclick="generatePins(${p.id})">Izveidot 3 atšķirīgus Pin</button></div>`
}
function buildPin(type,imgIndex,ai){
 const p=state.activeProduct;
 const title=type==="LINK"
  ? `${p.title} | Chic Women's Outfit Idea`
  : imgIndex===0
    ? `Classy Everyday Outfit | ${p.title}`
    : `Easy Fall Outfit Idea | ${p.title}`;
 return {
   id:Date.now()+imgIndex,type,img:p.images[imgIndex],sourceImage:imgIndex+1,
   title,
   desc:`Discover an effortless women's outfit featuring the ${p.title.toLowerCase()}. Perfect for chic everyday looks, fall outfit inspiration and a versatile capsule wardrobe. Shop the look on Amazon. Paid link. #ad`,
   board:boards[imgIndex%boards.length],
   time:times[imgIndex],
   topics:["women's fashion","outfit ideas","capsule wardrobe","fall outfits","amazon finds"],
   alt:`Woman wearing ${p.title.toLowerCase()} styled as a chic everyday outfit`,
   affiliate:`https://www.amazon.com/dp/PRODUCT?tag=yourtag-20`,
   ai:ai?"Yes — image modified":"No — original Amazon image",
   aiDetails:ai?"Pinterest-format crop / editorial layout":"Original Amazon product image",
   typeLabel:type+" PIN"
 }
}
function generatePins(id){
 state.activeProduct=products.find(x=>x.id===id);
 // Deliberately different source images for the 3 Pins.
 state.generated=[buildPin("SAVE",0,true),buildPin("SAVE",1,true),buildPin("LINK",2,true)];
 state.page="generated";render()
}
function generatedPage(){
 const p=state.activeProduct, arr=state.generated||[];
 return `<button class="back" onclick="showPage('product')">‹ Atpakaļ</button>
 <h2>Ģenerētie Pini</h2>
 <p>Programma automātiski izvēlējās ${arr.length} dažādas bildes. Ja kāda nepatīk, vari to nomainīt pret jebkuru citu pieejamo Amazon bildi.</p>
 <div class="pin-list">
 ${arr.map((x,i)=>`
   <div class="card pin-editor-card">
     <div class="row" style="align-items:flex-start">
       <div style="flex:0 0 125px">
         <img style="width:125px;height:165px;object-fit:cover;border-radius:12px" src="${x.img}" id="preview-${i}">
       </div>
       <div>
         <span class="tag">${x.typeLabel}</span>
         <b style="display:block;margin-top:7px">${x.type==="LINK"?"LINK PIN":"SAVE PIN"}</b>
         <small style="display:block;margin-top:4px;color:var(--muted)">Pašlaik izmantota Amazon bilde #${x.sourceImage}</small>
         <small style="display:block;margin-top:4px;color:var(--green)">✓ Šī bilde netiek izmantota citam Pin</small>
       </div>
     </div>

     <div style="margin-top:14px">
       <label style="font-size:12px;font-weight:700;display:block;margin-bottom:7px">Nomainīt bildi</label>
       <div class="image-picker">
         ${p.images.map((url,j)=>{
           const usedByOther=arr.some((other,k)=>k!==i && other.sourceImage===j+1);
           const selected=x.sourceImage===j+1;
           return `<button class="image-option ${selected?"selected":""} ${usedByOther?"used":""}"
             ${usedByOther?"disabled":""}
             onclick="changePinImage(${i},${j})">
             <img src="${url}" alt="Amazon bilde ${j+1}">
             <span>${selected?"✓ Izvēlēta":"Bilde #"+(j+1)}${usedByOther?" · izmantota":""}</span>
           </button>`;
         }).join("")}
       </div>
     </div>

     <button class="secondary" style="width:100%;margin-top:12px" onclick="editGenerated(${i})">Rediģēt teksta informāciju</button>
   </div>
 `).join("")}
 </div>

 <div class="card" style="margin-top:14px">
   <b>Bilžu pārbaude</b>
   <div class="stat"><span>Dažādas bildes</span><b>${new Set(arr.map(x=>x.sourceImage)).size}/${arr.length}</b></div>
   <div class="stat"><span>Pieejamās Amazon bildes</span><b>${p.images.length}</b></div>
   <p style="margin-bottom:0">Ja produktam ir 4 bildes, vari brīvi nomainīt jebkuru no 3 izvēlētajām pret 4. bildi.</p>
 </div>

 <button class="primary" style="width:100%" onclick="addGenerated()">Pievienot grafikam</button>`;
}
function changePinImage(pinIndex,imageIndex){
 const arr=state.generated||[];
 const alreadyUsed=arr.some((x,i)=>i!==pinIndex && x.sourceImage===imageIndex+1);
 if(alreadyUsed){toast("Šī bilde jau tiek izmantota citam Pin");return}
 arr[pinIndex].img=state.activeProduct.images[imageIndex];
 arr[pinIndex].sourceImage=imageIndex+1;
 arr[pinIndex].alt=`Woman wearing ${state.activeProduct.title.toLowerCase()} styled as a chic everyday outfit`;
 render();
 toast(`Pin ${pinIndex+1}: izmantota Amazon bilde #${imageIndex+1}`);
}
function editGenerated(i){
 state.editIndex=i;state.edit=JSON.parse(JSON.stringify(state.generated[i]));state.page="edit";render()
}
function editPage(){
 const x=state.edit;
 return `<button class="back" onclick="state.page='generated';render()">‹ Atpakaļ</button><h2>Rediģēt ${x.type} Pin</h2>
 <div class="card">
 <img style="width:100%;border-radius:14px;max-height:430px;object-fit:cover" src="${x.img}">
 <div class="muted" style="margin-top:7px">Izmantotā Amazon bilde: #${x.sourceImage}</div>
 <div class="field"><label>Pin tips</label><select id="etype"><option ${x.type==="SAVE"?"selected":""}>SAVE</option><option ${x.type==="LINK"?"selected":""}>LINK</option></select></div>
 <div class="field"><label>Title — English</label><input id="etitle" value="${x.title}"></div>
 <div class="field"><label>Description — English</label><textarea id="edesc">${x.desc}</textarea></div>
 <div class="field"><label>Pinterest Board</label><select id="eboard">${boards.map(b=>`<option ${b===x.board?"selected":""}>${b}</option>`).join("")}</select></div>
 <div class="field"><label>Publishing time</label><select id="etime">${times.map(t=>`<option ${t===x.time?"selected":""}>${t}</option>`).join("")}</select></div>
 <div class="field"><label>Keywords — English</label><input id="ekeywords" value="${(x.keywords||x.topics.join(", ")).replace(/"/g,"&quot;")}"></div><div class="field"><label>Tag Topics — English</label><input id="etopics" value="${x.topics.join(", ")}"></div>
 <div class="field"><label>Alt Text — English</label><textarea id="ealt">${x.alt}</textarea></div>
 <div class="field"><label>Affiliate link</label><input id="elink" value="${x.affiliate}"></div>
 <div class="field"><label>AI modification?</label><select id="eai"><option ${x.ai.startsWith("Yes")?"selected":""}>Yes — AI modified</option><option ${x.ai.startsWith("No")?"selected":""}>No — original Amazon image</option></select></div>
 <div class="card" style="background:#fbf1ed"><b>AI modification details</b><p style="margin-bottom:0">${x.aiDetails}</p></div>
 <button class="primary" style="width:100%" onclick="saveEdited()">Saglabāt Pin</button>
 </div>`
}
function saveEdited(){
 const x=state.edit;
 x.type=document.getElementById("etype").value;x.title=document.getElementById("etitle").value;x.desc=document.getElementById("edesc").value;
 x.board=document.getElementById("eboard").value;x.time=document.getElementById("etime").value;
 x.keywords=document.getElementById("ekeywords").value;x.topics=document.getElementById("etopics").value.split(",").map(s=>s.trim()).filter(Boolean);x.alt=document.getElementById("ealt").value;
 x.affiliate=document.getElementById("elink").value;x.ai=document.getElementById("eai").value;
 x.aiDetails=x.ai.startsWith("Yes")?"Pinterest-format crop / editorial layout":"Original Amazon product image";
 state.generated[state.editIndex]=x;state.page="generated";render();toast("Pin saglabāts")
}
function addGenerated(){
 const arr=state.generated||[];
 state.pins.push(...arr);state.schedule.push(...arr);save();state.generated=[];state.activeProduct=null;state.page="schedule";render();toast("3 atšķirīgi Pini pievienoti grafikam")
}
function pinsPage(){
 return `<h2>Mani Pini</h2>${state.pins.length?state.pins.map(x=>`<div class="card"><div class="row"><img class="thumb" src="${x.img}"><div><span class="tag">${x.type}</span><b style="display:block;margin-top:5px">${x.title}</b><small>${x.board} · ${x.time}</small><small style="display:block">AI: ${x.ai}</small></div></div></div>`).join(""):`<div class="empty">Vēl nav saglabātu Pin.</div>`}`
}
function schedulePage(){
 let days=[...Array(30)].map((_,i)=>i+1);
 return `<h2>Manas publikācijas</h2><div class="card"><div style="display:flex;justify-content:space-between"><b>Septembris 2026</b><b>›</b></div><div class="calendar" style="margin-top:12px">${days.map(d=>`<div class="day ${d===24?"active":""}">${d}</div>`).join("")}</div></div>
 <div class="card"><h2>Pini 24. sept.</h2>${state.schedule.length?state.schedule.slice(-3).map(x=>`<div class="agenda-item"><img class="thumb" src="${x.img}"><div><span class="tag">${x.type}</span><div>${x.title}</div><small>${x.time} · ${x.board}</small></div></div>`).join(""):"<div class='empty'>Šodien vēl nav ieplānotu Pin.</div>"}</div>
 <div class="card"><div class="stat"><span>Dienas mērķis</span><b>${Math.min(3,state.schedule.length)}/3</b></div><div class="progress"><div style="width:${Math.min(100,state.schedule.length/3*100)}%"></div></div></div>`
}
function saveBackendUrl(){const v=document.getElementById("backendUrl")?.value?.trim()||"";localStorage.setItem("backendUrl",v);toast("Backend adrese saglabāta")}
function settings(){
 const backendUrl=localStorage.getItem("backendUrl")||"";
 return `<h2>Iestatījumi</h2><div class="card"><h2>Amazon savienojums</h2><div class="field"><label>Backend URL</label><input id="backendUrl" value="${backendUrl}" placeholder="https://tavs-backend.example.com"></div><div class="field"><label>Partner Tag</label><input placeholder="yourtag-20"></div><div class="field"><label>Creators API Client ID</label><input placeholder="Ievadi Client ID"></div><p class="muted">Client Secret šeit neglabājam. Tas paliek drošajā backendā.</p><button class="primary" style="width:100%" onclick="saveBackendUrl()">Saglabāt</button></div>
 <div class="card"><h2>Pinterest savienojums</h2><p>Šeit vēlāk pieslēgsim Pinterest kontu publicēšanai.</p><button class="secondary" style="width:100%" onclick="toast('Pinterest savienojums būs nākamajā versijā')">Pieslēgt Pinterest</button></div>
 <div class="card"><h2>Mani Pinterest dēļi</h2>${boards.map(b=>`<div class="stat"><span>${b}</span><b>✓</b></div>`).join("")}</div>`
}
function render(){
 let c=document.getElementById("content");
 c.innerHTML=state.page==="home"?home():state.page==="products"?productsPage():state.page==="product"?productPage():state.page==="generated"?generatedPage():state.page==="edit"?editPage():state.page==="pins"?pinsPage():state.page==="schedule"?schedulePage():settings();
 nav()
}
render();
</script>
</body>
</html>
